<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>
<body>
    <h1>Contact Us</h1>
    <!--Navigation bar-->
    <p>
        <a href="index.html">Home |</a>
        <a href="about.html">About |</a>
        <a href="contact.html">Contact |</a>
        <a href="menu.html">Menu |</a>
    </p>

    <main>
        <hr>
        <h2>Customer registration and order form</h2>
        <hr>
        <form action="#" method="">
            <label for="fulname">FullName : </label>
        
            <input type="text" name="fullname"
             id="fullname" placeholder="Enter fullname"
             required>
            <br><br>
            <label for="email">Email Address</label>
            <input type="email" name="email"
            id="email" placeholder="Enter Email Address"
            required>
            <br><br>
            <label for="password">Password</label>
            <input type=password" name="password"
            id="password" placeholder="Enter Password"
            required>
            <br><br>
            <label for="phone">Phone number</label>
            <input type="tel" name="phone"
            id="phone" placeholder="Enter Phone number"
            required>
            <br><br>
            
            <h3>Order Information</h3>
        <label for="quantity">Quantity</label>
        <br>
        <input type="number" id="quantity" name="quantity">
        <br><br>

        <label for="deliveryDate">
            Preferred Delivery Date
        </label>
        <br>
        <input type="date" id="deliveryDate" name="deliveryDate">
        <br><br>

        <label for="food"> Select Food Item </label>
        <br>
<select id="food" name="food">
            <option>
                Veg Pizza
            </option>

            <option>
                Cheese Burger
            </option>

            <option>
                White Sauce Pasta
            </option>

            <option>
                Veg Grilled Sandwich
            </option>

            <option>
                Chocolate Brownie
            </option>
        </select>
        <br><br>

        <h3> Payment Method </h3>

        <input type="radio" id="cash" name="payment">
        <label for="cash"> Cash </label>
        <br>
<input type="radio" id="card" name="payment">
        <label for="card"> Card </label>
        <br>
        <input type="radio" id="upi" name="payment">
        <label for="upi">UPI </label>
        <br><br>

        <h3> Extras </h3>
        <input type="checkbox" id="cheese" name="extras">
        <label for="cheese"> Extra Cheese </label>
        <br>

        <input type="checkbox" id="drink" name="extras">
        <label for="drink"> Cold Drink </label>
        <br>

        <input type="checkbox" id="dessert" name="extras">
        <label for="dessert"> Dessert </label>
        <br><br>

        <h3>Delivery Instructions </h3>
        <label for="address"> Delivery Address </label>
        <br> <textarea id="address" name="address" rows="5" cols="40"> </textarea>
        <br><br>

        <input type="submit" value="Place Order">
        <input type="reset" value="Clear Form">
   
        </form>
    </main>
    <br>
    <h2>Visit our website</h2>
    <p>
        <a href="https://www.google.com">Visit Google</a>
    </p>
    <br>
</body>
</html>
